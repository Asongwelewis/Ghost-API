[project]
name = "ghostapi0"
version = "0.1.0"
description = "Catches hallucinated, removed and too-new API calls in AI-written code, checked against the exact versions in your lockfile."
readme = "README.md"
license = "MIT"
authors = [{ name = "Asongwe Lewis Fon" }]
maintainers = [{ name = "Asongwe Lewis Fon" }]
requires-python = ">=3.12"
keywords = [
    "ai", "llm", "coding-agents", "hallucination", "static-analysis", "api",
    "linter", "claude-code", "codex", "cursor", "openapi", "lockfile",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "griffe>=2.4.1",
    "httpx>=0.28.1",
    "packaging>=26.3",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.1",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.3",
]

[project.scripts]
ghostapi = "ghostapi.cli:main"

[project.urls]
Homepage = "https://github.com/Asongwelewis/Ghost-API"
Documentation = "https://github.com/Asongwelewis/Ghost-API/tree/dev/docs"
Issues = "https://github.com/Asongwelewis/Ghost-API/issues"
Changelog = "https://github.com/Asongwelewis/Ghost-API/blob/dev/CHANGELOG.md"
Source = "https://github.com/Asongwelewis/Ghost-API"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostapi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/ghostapi/bootstrap.py" = ["E501"]  # agent instructions keep commands on one line
"tests/test_endpoints.py" = ["E501"]  # fixtures embed framework source code verbatim

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real PyPI (run with GHOSTAPI_NETWORK_TESTS=1)"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
