name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 6 * * 1" # weekly, catches PyPI-side drift in the live test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  live:
    name: Live PyPI test
    runs-on: ubuntu-latest
    # Depends on pypi.org, so it reports but never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m network
        env:
          GHOSTAPI_NETWORK_TESTS: "1"

  build:
    name: Build & smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build
      - name: Install the wheel in a clean environment and run it
        run: |
          uvx --from dist/*.whl ghostapi --version
          mkdir smoke && cd smoke
          printf 'import requests\nrequests.get("https://example.com")\n' > app.py
          uvx --from ../dist/*.whl ghostapi init --agent agents-md
          uvx --from ../dist/*.whl ghostapi check --offline --format json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  action:
    name: Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: ghost
        uses: ./
        with:
          path: .github/action-test
          fail-on: never
      - name: Verify the action's outputs
        env:
          SARIF: ${{ steps.ghost.outputs.sarif-file }}
          CODE: ${{ steps.ghost.outputs.exit-code }}
        run: |
          test "$CODE" = "0"
          grep -q unregistered-api-call "$SARIF"  # needs no network
          grep -q unknown-symbol "$SARIF" || echo "::warning::unknown-symbol missing; PyPI unreachable?"

  # The one check to require in branch protection, so matrix changes never need a settings update.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, build, action]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All required jobs passed."
